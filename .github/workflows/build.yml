name: Build Installer EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ej: v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller

    - name: Build EXE
      run: |
        pyinstaller --clean --onefile --windowed --name "SacredWare_Installer" installer.py

    - name: Create Release and Upload
      uses: softprops/action-gh-release@v2
      with:
        files: dist/SacredWare_Installer.exe
        tag_name: ${{ github.event.inputs.version }}
        name: "SacredWare Installer ${{ github.event.inputs.version }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
