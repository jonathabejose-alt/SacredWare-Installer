name: Build SacredWare Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ej: v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install PyQt6
        
    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "SacredWare_Installer" installer.py
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/SacredWare_Installer.exe
        tag_name: ${{ github.event.inputs.version }}
        name: "SacredWare Installer ${{ github.event.inputs.version }}"
        body: |
          SacredWare Automated Installer
          
          - Auto-updates itself
          - Downloads latest SacredWare.exe
          - Creates desktop shortcut (optional)
          - Manages folders and caches automatically
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
